# LoRA fine-tuning template for the Irodori (Japanese) backend, Irodori-TTS-v4.1-Small.
#
#   run_training.py --config lora --manifest <train_manifest.jsonl> --output-dir <out>
#
# Values are the ones a reference run on an RTX 5060 Ti 16 GB actually used, on a 69-clip
# / ~7 min single-speaker Japanese dataset: steady 1.9-2.3 s/step at batch 16 (~6.4
# samples/s), 2000 steps in 50-90 minutes. Every comment below says WHY a number is what
# it is; the ones without a comment are architecture, not taste.

# DO NOT EDIT THIS BLOCK. It describes the shape of the v4.1-Small checkpoint you are
# adapting. A value that disagrees with the checkpoint either fails to load or loads into
# the wrong tensors. The two `*_tokenizer_repo` lines are also the honest reason this
# backend is Japanese: the text encoder is a Japanese ModernBERT, and a transcript in
# another language teaches the adapter a text->voice mapping that does not hold when you
# generate from Japanese text.
model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 512
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf

  # ---- the LoRA itself -----------------------------------------------------------
  lora_enabled: true
  # r=16 / alpha=32 (scale 2.0) is the upstream default and what the reference run used.
  # Raising r buys capacity you do not have data for at ~60 clips; the adapter is already
  # ~100 MiB on disk at r=16 because `lora_modules_to_save: auto` also saves the whole
  # duration predictor with it.
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  # `diffusion_attn` adapts the attention projections of the 12 diffusion blocks and
  # leaves the shared ModernBERT text backbone alone. That is the right target for
  # "sound like this person": prosody and timbre live in the diffusion body, not in the
  # text encoder. `pretrained_backbone_attn` / `pretrained_backbone_attn_mlp` exist for
  # adapting the text side, which is a different job and needs far more data.
  lora_target_modules: diffusion_attn
  # `auto` keeps the duration predictor trainable and stores it in the adapter, so the
  # pack carries this speaker's speaking rate as well as their voice.
  lora_modules_to_save: auto

  # ---- schedule ------------------------------------------------------------------
  # 16 fits comfortably in 16 GB VRAM at bf16 for this model. Lower it first if you OOM.
  batch_size: 16
  gradient_accumulation_steps: 1
  # 2000 steps is the budget, NOT the answer. In the reference run the best validation
  # loss was at step 1000 and step 2000 had visibly overfit (similarity dropped, and the
  # val-loss curve agreed). Pick the checkpoint by val loss, never by "the last one".
  max_steps: 2000
  optimizer: adamw
  learning_rate: 0.0001
  # The shared pretrained text encoder moves 10x slower than the adapter when it moves at
  # all. Leave it.
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  # warmup -> stable -> decay. 100 + 1500 leaves 400 steps of decay at the end of a
  # 2000-step budget. If you change max_steps, change stable_steps with it.
  lr_scheduler: wsd
  warmup_steps: 100
  stable_steps: 1500
  min_lr_scale: 0.01
  precision: bf16
  seed: 0

  # ---- checkpoint selection ------------------------------------------------------
  # 5% held out. On 163 rows that is 8 clips; on 69 rows it is 3. Both are small, and the val
  # loss is correspondingly noisy - see the warning under `valid_every`. Do not set this to 0:
  # no val loss means no best-checkpoint selection, which is the whole selection mechanism.
  valid_ratio: 0.05
  # DERIVED, not used as written: `run_training.py` computes the cadence from the corpus and passes
  # `--valid-every`/`--save-every`, because a step count cannot be right for two corpus sizes at
  # once - at batch 16, 100 steps is 9 epochs of 163 rows and 1.6 epochs of 1000. It validates and
  # saves every 5-8 epochs, taking the widest interval that still leaves more validations than both
  # `early_stopping_patience` and `checkpoint_best_n` need. Measured examples: 69 rows -> every 40
  # steps, 163 -> 88, 400 -> 200. The value below is the fallback when the row count is unknown, and
  # passing either flag after `--` turns the derivation off entirely.
  #
  # Resolution matters, which is why the interval is epochs and not a round number: at 500 steps a
  # real run measured 500 -> 0.762481, 1000 -> 0.782561, 1500 -> 0.802053, 2000 -> 0.812336, i.e.
  # monotonically worse from the first point, so the optimum sat at or before step 500 and the grid
  # had no resolution there. The best checkpoint of that run was simply the earliest one it saved.
  #
  # Affordable because the held-out split is tiny: 5% of 163 rows is 8 clips, and one validation on
  # 8 clips is far below the ~740 ms a training step already costs. Validation is also
  # deterministic (fixed seed, in-process loader), so two runs agree to 1.75e-4 and successive
  # points are comparable - which they were not when each call re-drew its own noise, timesteps
  # and reference concatenation.
  #
  # `save_every` MUST stay a multiple of this. A periodic save then always lands on a step that was
  # just validated, which is what lets `run_training.py` stamp that loss onto the periodic
  # checkpoint's name instead of leaving it looking unvalidated. The derivation sets them equal.
  valid_every: 100
  # Keeps the N best-by-val-loss adapters as `checkpoint_best_val_loss_<step>_<loss>/`, of which
  # `run_training.py` leaves exactly one named `best` - the lowest - and renames the rest to
  # `checkpoint_val_loss_*`.
  #
  # MUST stay below the number of validations, or the eviction gate never fires and every
  # validation is written as a "best". That is what happened at 5 with four validations: four
  # directories all named `best_val_loss`, three of them worse than the first. The derived cadence
  # now guarantees more than `max(this, early_stopping_patience)` validations, so this cannot
  # silently break again - but keep it small anyway, because every surviving candidate costs a full
  # sample-generation pass in stage 4 and a scoring pass in stage 5.
  checkpoint_best_n: 3
  # Derived alongside `valid_every` and set equal to it, so every periodic save lands on a
  # validated step. This value is the fallback: 500 is a multiple of the 100 above.
  save_every: 500
  log_every: 100

  # ---- dataloader: this is the GPU-starvation fix, read the comment ---------------
  # A few hundred clips at batch 16 is ~4 batches per epoch, so the epoch boundary comes
  # around constantly. With persistent_workers false, Windows re-spawns every worker at
  # each boundary (1-3 s each, because each one re-imports torch) and the GPU sits idle
  # between them: measured 20% duty cycle over 30 samples, with CPU at only 30%.
  # `dataloader_persistent_workers: true` took that to 99-100%. THAT is the fix.
  #
  # num_workers is NOT the fix, and it is not free: each Windows worker is ~700 MB
  # resident and persistent workers hold it for the whole run. `num_workers: 8` with a
  # train and a valid loader meant 16 workers and ~11.4 GB, which nearly filled a 32 GB
  # machine. 0-2 is right for a dataset this size. 0 is legal and disables both flags
  # below with a warning.
  num_workers: 2
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: true
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false

  # ---- objective and conditioning ------------------------------------------------
  # 750 frames at 25 latent frames/s = 30 s. A longer clip is truncated here while its
  # full transcript is still fed in, which is why prepare_dataset.py drops clips over 30 s.
  max_latent_steps: 750
  # References are drawn from other clips of the same SAME-SPLIT speaker_id and concatenated to
  # a length drawn uniformly from this range. (Audited: the sampler is split-local, so a
  # training sample cannot be conditioned on a held-out clip and the val loss is not
  # contaminated by that path.)
  #
  # 30 s, not upstream's 120 s, and the authority is upstream's own docs/parameters.md:
  # "Approximately 30 seconds of combined reference audio captured most of the measured
  # speaker-similarity gain." Past that the draw buys nothing measured and costs something real:
  # on a 15.9-minute corpus a uniform draw over 1-120 s almost always exceeds the speaker's
  # remaining clips, so the greedy concatenation returns EVERY sibling it has, clamped at 3000
  # frames - about 20 clips. "The reference" then stops being a reference and becomes a large
  # random slice of the whole corpus, different on every sample and on every validation.
  # Capping at 30 s keeps the measured gain, makes the draw actually vary, and cuts one of the
  # noise sources that makes successive validation losses incomparable.
  ref_min_seconds: 1.0
  ref_max_seconds: 30.0
  max_text_len: 256
  max_caption_len: 512
  # 10% of samples drop each condition, which is what keeps unconditional generation
  # working - and generating from a LoRA pack uses exactly that path (no reference audio,
  # the adapter carries the voice).
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1

  # ---- off ------------------------------------------------------------------------
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
